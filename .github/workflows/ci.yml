name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: format, lint, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --locked --lib --bins --examples --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

  web:
    name: web tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The web tests cover the dependency-free modules, so they need no install
      - name: Run tests
        run: npm test

  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runs-on: ubuntu-latest
          - name: linux-arm64
            runs-on: ubuntu-24.04-arm
          - name: macos-arm64
            runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --locked --release

      - name: Smoke test
        shell: bash
        run: |
          ./target/release/diceroll --help
          ./target/release/diceroll d20

      - name: Package binary
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p release
          cp target/release/diceroll "release/diceroll-${{ github.ref_name }}-${{ matrix.name }}"

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: diceroll-${{ matrix.name }}
          path: release/diceroll-${{ github.ref_name }}-${{ matrix.name }}
          if-no-files-found: error

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: |
          cd diceroll_wasm
          bash build.sh

      - name: Package WASM
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p release
          cp -r diceroll_wasm/www/pkg release/diceroll_wasm
          cd release && tar -czvf "diceroll-${{ github.ref_name }}-wasm.tar.gz" diceroll_wasm

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: diceroll-wasm
          path: release/diceroll-${{ github.ref_name }}-wasm.tar.gz
          if-no-files-found: error

      - name: Upload WASM pkg
        uses: actions/upload-artifact@v7
        with:
          name: android-wasm-pkg
          path: diceroll_wasm/www/pkg
          if-no-files-found: error

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: build-wasm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Download WASM pkg
        uses: actions/download-artifact@v8
        with:
          name: android-wasm-pkg
          path: diceroll_wasm/www/pkg

      - name: Install Capacitor
        run: npm ci

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Package APK
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/diceroll-${{ github.ref_name }}-android.apk"

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: diceroll-android
          path: release/diceroll-${{ github.ref_name }}-android.apk
          if-no-files-found: error

  version-check:
    name: version matches the tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check the tag against the workspace version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"

          # The single source of truth: the same value the crates inherit and
          # android/app/build.gradle reads for versionName/versionCode
          workspace_version="$(awk -F'"' '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                     { in_section = 0 }
            in_section && /^version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)"

          if [ -z "$workspace_version" ]; then
            echo "::error::No [workspace.package] version found in Cargo.toml"
            exit 1
          fi

          if [ "$tag" != "$workspace_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the workspace version ${workspace_version}. Update [workspace.package] in Cargo.toml, or retag."
            exit 1
          fi

          # Every crate must still inherit it: the binaries report the inherited
          # version while the Android build reads Cargo.toml directly, so the two
          # can only agree while inheritance is intact
          mismatched="$(cargo metadata --format-version 1 --no-deps \
            | jq -r --arg v "$workspace_version" \
              '.packages[] | select(.version != $v) | "\(.name) is at \(.version)"')"

          if [ -n "$mismatched" ]; then
            echo "::error::Crates not inheriting ${workspace_version}: ${mismatched}"
            exit 1
          fi

          echo "Tag ${GITHUB_REF_NAME} matches the workspace version ${workspace_version}"

  release:
    name: release
    runs-on: ubuntu-latest
    needs:
      - version-check
      - build
      - build-android
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: diceroll-*
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
