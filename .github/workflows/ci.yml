name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: format, lint, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --locked --lib --bins --examples --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runs-on: ubuntu-latest
          - name: linux-arm64
            runs-on: ubuntu-24.04-arm
          - name: macos-arm64
            runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --locked --release

      - name: Smoke test
        shell: bash
        run: |
          ./target/release/diceroll --help
          ./target/release/diceroll d20

      - name: Package binary
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p release
          cp target/release/diceroll "release/diceroll-${{ github.ref_name }}-${{ matrix.name }}"

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: diceroll-${{ matrix.name }}
          path: release/diceroll-${{ github.ref_name }}-${{ matrix.name }}
          if-no-files-found: error

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: |
          cd diceroll_wasm
          bash build.sh

      - name: Package WASM
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p release
          cp -r diceroll_wasm/www/pkg release/diceroll_wasm
          cd release && tar -czvf "diceroll-${{ github.ref_name }}-wasm.tar.gz" diceroll_wasm

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: diceroll-wasm
          path: release/diceroll-${{ github.ref_name }}-wasm.tar.gz
          if-no-files-found: error

      - name: Upload WASM pkg
        uses: actions/upload-artifact@v7
        with:
          name: android-wasm-pkg
          path: diceroll_wasm/www/pkg
          if-no-files-found: error

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: build-wasm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Download WASM pkg
        uses: actions/download-artifact@v8
        with:
          name: android-wasm-pkg
          path: diceroll_wasm/www/pkg

      - name: Install Capacitor
        run: npm ci

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Package APK
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/diceroll-${{ github.ref_name }}-android.apk"

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: diceroll-android
          path: release/diceroll-${{ github.ref_name }}-android.apk
          if-no-files-found: error

  release:
    name: release
    runs-on: ubuntu-latest
    needs:
      - build
      - build-android
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: diceroll-*
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
