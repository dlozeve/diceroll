[workspace]
members = ["diceroll", "diceroll_cli", "diceroll_wasm"]
resolver = "3"

# Single source of truth for the version. The crates inherit it, and
# android/app/build.gradle reads it from here for versionName/versionCode.
[workspace.package]
version = "0.3.0"
authors = ["Dimitri Lozeve"]
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.lints.clippy]
# Safety - treat as errors
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Code quality - warnings
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Cargo
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"

[profile.release]
opt-level = "s"
lto = true
